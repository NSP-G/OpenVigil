name: Release

# 正式版发布：打 v* 标签时构建 exe 并挂到 Release。
#
# 与 build.yml 分离的原因：
#   build.yml 每次 push 都跑（CI 门禁），
#   若让它顺带发 Release，公开仓库的 Releases 页会被
#   每次提交的 win-build-N 塞满，真正给用户下载的版本反而被淹没。
#   正式版只在人工打标签时产出，一个标签对应一个可下载的版本。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（如 v0.3.1）
        required: true

jobs:
  publish:
    name: Build and publish exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file exe
        # 构建参数与 build.yml 的 Windows (exe) 作业保持一致。
        # 两处若 drift（比如这里少了 --collect-all yaml），
        # 就会出现"CI 绿着、发出去的 exe 一运行就崩"。
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Vigil `
            --paths . `
            --collect-all app `
            --collect-all yaml `
            --add-data "gui/web;web" `
            --add-data "config.json;." `
            --hidden-import win32timezone `
            --collect-all webview `
            --icon "packaging/vigil.ico" `
            gui/main_gui.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Vigil.exe")) {
            Write-Error "未生成 dist/Vigil.exe"
            exit 1
          }
          $size = (Get-Item "dist/Vigil.exe").Length / 1MB
          Write-Host "exe 大小: %.1f MB" -f $size

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh release create "$TAG" dist/Vigil.exe \
            --repo "${{ github.repository }}" \
            --title "Vigil $TAG" \
            --notes "自动构建产物。更新内容见提交历史与 README。" \
            --latest
