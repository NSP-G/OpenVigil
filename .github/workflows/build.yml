name: Build Vigil

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

  windows:
    name: Windows (exe)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Vigil `
            --paths . `
            --collect-all app `
            --add-data "gui/web;web" `
            --add-data "config.json;." `
            --hidden-import win32timezone `
            --collect-all webview `
            --icon "packaging/vigil.ico" `
            gui/main_gui.py

      - name: Verify artifact
        run: |
          if (Test-Path "dist/Vigil.exe") {
            $size = (Get-Item "dist/Vigil.exe").Length / 1MB
            Write-Output "Vigil.exe 构建成功，大小: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "dist/Vigil.exe 未找到，构建失败"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Vigil-windows
          path: dist/Vigil.exe
          retention-days: 30

  linux:
    name: Linux (source package)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build source tarball
        run: |
          mkdir -p dist/Vigil-linux
          cp -r app gui tests main.py config.json requirements.txt README.md dist/Vigil-linux/
          cp packaging/start-linux.sh dist/Vigil-linux/start.sh
          chmod +x dist/Vigil-linux/start.sh
          tar czf dist/Vigil-linux.tar.gz -C dist Vigil-linux
          echo "源码包大小：$(du -h dist/Vigil-linux.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Vigil-linux
          path: dist/Vigil-linux.tar.gz
          retention-days: 30

  release:
    name: Publish Windows Release
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Vigil-windows
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="win-build-${{ github.run_number }}"
          echo "发布 tag: $TAG"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" dist/Vigil.exe \
            --repo "${{ github.repository }}" \
            --title "Vigil Windows · build ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "GitHub Actions 自动构建（run #${{ github.run_number }}）。下载 Vigil.exe 后直接运行即可。"
