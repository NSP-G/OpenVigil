name: Deliver exe via branch

# 临时通道：把构建产物取出受限网络环境。
#
# release 资源与 Actions 产物都指向对象存储，受限网络下被策略 403 拦掉，
# 一个字节都拿不到；而 api.github.com 的 git-blobs 接口是通的。
# 因此由 runner（网络正常）把 exe 提交到临时孤儿分支，
# 外部再通过 git blobs 读回。用后即删。
on:
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载最近一次成功构建的产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=build.yml --status=success \
                    --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "使用构建 run_id=$RUN_ID"
          gh run download "$RUN_ID" --name Vigil-windows --dir ./dist
          ls -la ./dist
          test -f ./dist/Vigil.exe

      - name: 提交到临时分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "deliver-bot"
          git config user.email "deliver-bot@noreply"
          git checkout --orphan deliver-exe-tmp
          git rm -rf --quiet . || true
          cp ./dist/Vigil.exe ./Vigil.exe
          git add -f Vigil.exe
          git commit -m "临时交付：Vigil.exe"
          git push --force origin deliver-exe-tmp
